<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c83ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="lg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7c83ff" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Stacked sheets representing 'stack' of resumes -->
  <g filter="url(#lg-shadow)">
    <rect x="14" y="20" width="32" height="38" rx="5" fill="url(#lg-grad)" opacity="0.45"/>
    <rect x="11" y="14" width="32" height="38" rx="5" fill="url(#lg-grad)" opacity="0.7"/>
    <rect x="8"  y="8"  width="32" height="38" rx="5" fill="url(#lg-grad)"/>
  </g>
  <!-- Lines representing resume content -->
  <g stroke="white" stroke-linecap="round" stroke-width="2.6" opacity="0.95">
    <line x1="14" y1="17"  x2="34" y2="17"/>
    <line x1="14" y1="23"  x2="28" y2="23"/>
    <line x1="14" y1="29"  x2="32" y2="29"/>
    <line x1="14" y1="35"  x2="26" y2="35"/>
  </g>
  <!-- Sparkle accent -->
  <path d="M51 11 L52.6 14.4 L56 16 L52.6 17.6 L51 21 L49.4 17.6 L46 16 L49.4 14.4 Z"
        fill="#a78bfa" opacity="0.95"/>
</svg>

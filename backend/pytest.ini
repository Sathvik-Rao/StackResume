[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    -p no:warnings
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: pure-function unit tests (no FastAPI, no DB)
    api: HTTP-level integration tests against the FastAPI app
    agents: LangGraph agent / pipeline tests (LLM is faked)
    documents: PDF / DOCX / ODT generator smoke tests
    slow: marks a test as slow (deselect with '-m "not slow"')
